# pyproject.toml compatible with Poetry (version 2.0+)
[project]
name = "piclas-db"
# Versioning: start with 0.1.0, increment the minor version (0.x.0) with each development step and release 1.0.0 once the tool is
# feature complete (see CHANGELOG.md)
version = "0.5.0"
description = "Build, check and convert PICLas species and cross-section databases (database.h5) from original sources such as LXCat and NIST"
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Stephen Copplestone", email = "copplestone@boltzplatz.eu"},
]
dependencies = [
    "h5py>=3.16.0",
    "numpy>=2.0.0",
    "packaging>=24.0",
    "pyyaml>=6.0",
    ]
keywords = [
    "PICLas",
    "species database",
    "cross-sections",
    "LXCat",
    "DSMC",
    "PIC",
    "plasma",
    "HDF5"
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
dev = [
    "coverage>=7.17.0",
    "prek>=0.2.0",
    "pytest>=8.0.0",
    "types-pyyaml>=6.0",
    "ruff>=0.16.7",
    "ty>=0.0.92",
    "vulture>=2.15",
]

[project.urls]
repository = "https://github.com/piclas-framework/piclas-db"

[project.scripts]
piclas-db = "piclas_db.piclas_db:entry_point"

# Build system
[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

# Legacy setuptools support
[tool.setuptools.packages.find]
include = ["piclas_db*"]

[tool.poetry]
packages = [
    { include = "piclas_db" }
]

[tool.ruff]
line-length = 220
indent-width = 4
force-exclude = true
exclude = [
    # Exclude a variety of commonly ignored directories.
    ".git",
    ".pyenv",
    ".venv",
    ".vscode",
    "dist",
    "node_modules",
    "site-packages",
    "venv"
    ]
# Required Ruff version
required-version = ">=0.16.7"
show-fixes = true

[tool.ruff.lint]
extend-select = [
  # "ANN",      # flake8-annotations
  "B",        # flake8-bugbear
  "C4",       # flake8-comprehensions
  "FA",       # flake8-future-annotations
  "RET",      # flake8-return
  "SIM",      # flake8-simplify
  "SLOT",     # flake8-slots
  "TID",      # flake8-tidy-imports
  "PERF",     # Perflint
  "FURB",     # refurb
  "I",        # isort
  "NPY",      # NumPy-specific rules
  # "RUF",      # Ruff-specific rules
  ]
ignore = [
  "EXE001",   # shebang-not-executable             - we use shebang as file format identifier
  "I001",     # unsorted-imports                   - we use logical sorting instead of alphabetical
  "RET501",   # unnecessary-return-none            - we want to be explicit about our return values
  "RUF001",   # ambiguous-unicode-character-string - we want to use all characters
  "RUF100",   # unused-noqa                        - we want to have multiple linters, thus sometimes more exceptions are necessary
  "UP009",    # utf8-encoding-declaration          - we want to be explicit about our encoding
  "UP007",    # non-pep604-annotation-union        - we want explicit typing.Union annotations
  "UP045",    # non-pep604-annotation-optional     - we want explicit typing.Optional annotations
  "PLR0402",  # manual-from-import                 - we want every import specify the module name
 ]

[tool.ruff.format]
indent-style = "space"
quote-style = "preserve"

[tool.ty.rules]
# Type checker
unused-ignore-comment      = 'ignore'

# Dead code
[tool.vulture]
paths = [
    "piclas_db",
]
min_confidence = 70
sort_by_size = true

[tool.coverage.run]
source = ["piclas_db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
