# Workflow for continuous integration (CI)
# Note: this public pipeline only uses synthetic test data. Builds from third-party data (LXCat, NIST, ...) run in the private
# source repository.
name: CI

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - master
      - main
  # Runs on pull requests
  pull_request:
  # Allows running this workflow manually from the Actions tab
  workflow_dispatch:

# Permissions
permissions:
  contents:  read        # default for all jobs
  packages:  read
  pull-requests: write   # coverage bot

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Environment variables
env:
  UV_LINK_MODE: copy

jobs:
# ----------------------------------------------------------------------------------------------------------------------------------------------------
# Setup venv
# ----------------------------------------------------------------------------------------------------------------------------------------------------
  venv:
    name: Setup venv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        id: cache
        with:
          path: .venv
          key: venv-${{ hashFiles('pyproject.toml') }}
      - name: Create virtual environment
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --editable ".[dev]"

# ----------------------------------------------------------------------------------------------------------------------------------------------------
# Linter
# ----------------------------------------------------------------------------------------------------------------------------------------------------
  ruff:
    name: Lint / ruff
    runs-on: ubuntu-latest
    needs: [venv]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ hashFiles('pyproject.toml') }}
      - name: Run ruff
        shell: bash
        run: |
          source .venv/bin/activate
          ruff --version
          ruff check --config pyproject.toml --preview piclas_db tests
          ruff format --check piclas_db tests

  ty:
    name: Lint / ty
    runs-on: ubuntu-latest
    needs: [venv]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ hashFiles('pyproject.toml') }}
      - name: Run ty
        shell: bash
        run: |
          source .venv/bin/activate
          ty --version
          ty check --color always --project piclas_db

  vulture:
    name: Lint / vulture
    runs-on: ubuntu-latest
    needs: [venv]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ hashFiles('pyproject.toml') }}
      - name: Run vulture
        shell: bash
        run: |
          source .venv/bin/activate
          vulture --version
          vulture --config pyproject.toml piclas_db

  gitleaks:
    name: Lint / gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: j178/prek-action@v3.0.0
        with:
          extra-args: --all-files gitleaks

  pre-commit:
    name: Lint / pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: j178/prek-action@v3.0.0
        with:
          extra-args: --all-files check-merge-conflict
      - uses: j178/prek-action@v3.0.0
        with:
          extra-args: --all-files check-symlinks
      - uses: j178/prek-action@v3.0.0
        with:
          extra-args: --all-files trailing-whitespace
      - uses: j178/prek-action@v3.0.0
        with:
          extra-args: --all-files check-added-large-files

# ----------------------------------------------------------------------------------------------------------------------------------------------------
# Compatibility
# ----------------------------------------------------------------------------------------------------------------------------------------------------
  compatibility:
    name: Compatibility / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: [ruff, ty, vulture, gitleaks, pre-commit]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python-version: "3.11" }
          - { python-version: "3.12" }
          - { python-version: "3.13" }
          - { python-version: "3.14" }
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/checkout@v5
      - name: Run compatibility tests
        shell: bash
        run: |
          # Virtual environment
          python -m venv .venv
          source .venv/bin/activate
          # Compatibility
          python -m pip install --editable .
          piclas-db --help
          piclas-db --version

# ----------------------------------------------------------------------------------------------------------------------------------------------------
# Tests (synthetic data only)
# ----------------------------------------------------------------------------------------------------------------------------------------------------
  tests:
    name: Tests / pytest
    runs-on: ubuntu-latest
    needs: [venv]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ hashFiles('pyproject.toml') }}
      - name: Run tests
        shell: bash
        run: |
          source .venv/bin/activate
          coverage run --parallel-mode -m pytest
      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-pytest
          path: .coverage.*
          include-hidden-files: true

# ----------------------------------------------------------------------------------------------------------------------------------------------------
# Coverage
# ----------------------------------------------------------------------------------------------------------------------------------------------------
  coverage:
    # combine the coverage data collected by all test jobs into a single report
    name: Coverage
    runs-on: ubuntu-latest
    needs: [tests]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ hashFiles('pyproject.toml') }}
      - name: Download coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-data-*
          merge-multiple: true
      - name: Combine coverage data and generate report
        shell: bash
        run: |
          source .venv/bin/activate
          coverage --version
          coverage combine
          coverage report --show-missing
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          coverage xml  -o coverage-report/coverage.xml
          coverage html -d coverage-report/html
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: piclas-db-coverage-report
          path: coverage-report/

  coverage-bot:
    # post the coverage report as a bot comment on the pull request
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
    runs-on: ubuntu-latest
    needs: [coverage]
    steps:
      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: piclas-db-coverage-report
      - name: Report coverage
        uses: orgoro/coverage@v3.3
        with:
          coverageFile: coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          thresholdAll: 0.80
          thresholdNew: 0.85
