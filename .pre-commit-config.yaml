# https://pre-commit.com/
# https://github.com/pre-commit/pre-commit
# https://prek.j178.dev
minimum_pre_commit_version: 4.5.1
# prek install sets up both hooks: the checks below run on commit, the tests (last hook) before a push
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version
    rev: v0.16.7
    hooks:
      # Run the linter
      - id: ruff
        args: [--config, pyproject.toml, --preview]
        name: ruff linter
        alias: lint
      # Run the formatter
      - id: ruff-format
        name: ruff formatter
        alias: format

  - repo: https://github.com/jendrikseipp/vulture
    # Vulture version
    rev: v2.15
    hooks:
      # Run dead code detection
      # Paths are configured under [tool.vulture] in pyproject.toml
      - id: vulture
        args: [--config, pyproject.toml, piclas_db]
        name: vulture dead code
        alias: vulture

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.83
    hooks:
      - id: ty
        name: ty type checker
        alias: ty
        entry: ty check --color always --project piclas_db
        language: system
        pass_filenames: false
        types: [python]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      # Run secrets detection engine
      - id: gitleaks
        name: gitleaks   [detect hardcoded secrets]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Check for files that contain merge conflict strings
      - id: check-merge-conflict
        name: pre-commit [check for merge conflicts]
      - id: check-symlinks
        name: pre-commit [check for broken symlinks]
      - id: trailing-whitespace
        name: pre-commit [trim trailing whitespace]
        exclude: \.(msh|patch|h5)$
        exclude_types: [markdown]
      # Keep data out of the public repository (see README.md)
      - id: check-added-large-files
        name: pre-commit [check for large files]
        args: [--maxkb=500]

  - repo: local
    hooks:
      # Run the test suite before pushing (about a minute; skip once with: SKIP=pytest git push)
      - id: pytest
        name: pytest   [tests before push]
        alias: tests
        entry: python -m pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
